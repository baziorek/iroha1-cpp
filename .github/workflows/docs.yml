name: Docs

on:
  push:
    branches: [ iroha1-main ]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.rst'   ## included by docs/source/community/index.rst
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install "setuptools<81"  ## m2r2 requires pkg_resources, removed in setuptools>=81
          pip install -r docs/source/requirements.txt
      - name: Build documentation
        ## sphinx extensions resolve paths relative to docs/source
        ## (e.g. 'concepts_architecture/glossary.rst'), so build from there
        run: cd docs/source && sphinx-build -b html . ../_build/html
      - name: Build translated documentation
        ## Turkish translation taken from the archived
        ## hyperledger-iroha/iroha-docs-l10n repo; output lands in
        ## docs/_build/html/<lang>/ next to the English version
        run: docs/i18n/build.sh docs/_build/html tr
      - name: Build local translations
        ## Translations maintained in this repo under docs/i18n/<lang>/;
        ## untranslated pages fall back to the current English docs
        run: docs/i18n/build-local.sh docs/_build/html pl ru ja
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
